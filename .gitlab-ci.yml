# =====================================================================
# Pipeline CI/CD - Cart Service (Tiki-clone)
# Spring Boot + Gradle + PostgreSQL
#
#   test ──► build ──► dockerize
#
# - Stage sau CHỈ chạy khi stage trước thành công (when: on_success + needs).
# - Test rớt => không sinh artifact .jar, không build/push Docker image.
# - Image được gắn tag theo commit SHA ($CI_COMMIT_SHORT_SHA), KHÔNG dùng tag latest.
# =====================================================================

stages:
  - test
  - build
  - dockerize

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Cache thư viện Gradle, chỉ làm mới khi file cấu hình build thay đổi
.gradle_cache: &gradle_cache
  key:
    files:
      - build.gradle
      - settings.gradle
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle/wrapper
    - .gradle/caches

# =====================================================================
# STAGE 1: TEST - Integration Test với PostgreSQL thật
# =====================================================================
integration_test:
  stage: test
  image: gradle:7.6-jdk17
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    # Container PostgreSQL đọc các biến này để tạo DB + user
    POSTGRES_DB: cart_db
    POSTGRES_USER: cart_user
    POSTGRES_PASSWORD: cart_password
    # Spring Boot đọc các biến này để kết nối tới service "postgres"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/cart_db"
    SPRING_DATASOURCE_USERNAME: cart_user
    SPRING_DATASOURCE_PASSWORD: cart_password
  cache:
    <<: *gradle_cache
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew test
  artifacts:
    # Luôn lưu báo cáo test (kể cả khi rớt) để xem trong tab "Tests" của pipeline
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    expire_in: 1 week

# =====================================================================
# STAGE 2: BUILD - Đóng gói file .jar
# =====================================================================
build_jar:
  stage: build
  image: gradle:7.6-jdk17
  needs:
    - job: integration_test     # Chỉ chạy khi integration_test PASS
      artifacts: false
  cache:
    <<: *gradle_cache
    policy: pull               # Chỉ đọc cache, không ghi lại
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day

# =====================================================================
# STAGE 3: DOCKERIZE - Build & push Docker image (chỉ trên nhánh main)
# =====================================================================
docker_build_push:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build_jar            # Lấy file .jar từ artifacts của build_jar
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: "$DOCKER_USERNAME/cart-service"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    # Dừng sớm với thông báo rõ ràng nếu chưa cấu hình CI/CD Variables
    - test -n "$DOCKER_USERNAME" || (echo "Chưa cấu hình biến DOCKER_USERNAME" && exit 1)
    - test -n "$DOCKER_PASSWORD" || (echo "Chưa cấu hình biến DOCKER_PASSWORD" && exit 1)
    - ls -l build/libs/
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    # Tag = commit SHA rút gọn (vd: cart-service:a1b2c3d4) => truy vết & rollback được
    - >
      docker build
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "Đã push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout
